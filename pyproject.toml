[project]
name = "ca-citations"
version = "0.1.0"
description = "Find and parse California statute, Constitution, CCR, and AG-opinion citations in prose"
authors = [{name = "Redwood Public Law, LLP"}]
readme = "README.md"
requires-python = ">=3.11"

# One runtime dependency on purpose: this package is imported by servers,
# scrapers, and bulk loaders, and anything added here lands in all of them.
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ca_citations"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
